<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaChat AI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <p class="auth-brand">✨ NovaChat AI</p>
      <h1 id="authHeading">Welcome back</h1>
      <p class="auth-subtitle" id="authSubtitle">Login to continue</p>
      <p id="authError" class="auth-error" role="alert" hidden></p>

      <div id="loginPanel">
        <form id="loginForm" class="auth-form">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" name="email" type="email" autocomplete="email" required />
          <label for="loginPassword">Password</label>
          <div class="password-field">
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" required />
            <button type="button" class="password-toggle" data-target="loginPassword" aria-label="Show password" title="Show password">
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 5c5.2 0 9.2 3.3 10.7 6.5a1.2 1.2 0 0 1 0 1C21.2 15.7 17.2 19 12 19S2.8 15.7 1.3 12.5a1.2 1.2 0 0 1 0-1C2.8 8.3 6.8 5 12 5Zm0 2C8.1 7 4.9 9.4 3.5 12 4.9 14.6 8.1 17 12 17s7.1-2.4 8.5-5C19.1 9.4 15.9 7 12 7Zm0 2.2A2.8 2.8 0 1 1 12 14.8 2.8 2.8 0 0 1 12 9.2Z"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3.3 2.3 21.7 20.7a1 1 0 0 1-1.4 1.4l-3.2-3.2A11.6 11.6 0 0 1 12 19c-5.2 0-9.2-3.3-10.7-6.5a1.2 1.2 0 0 1 0-1c.7-1.5 1.9-3 3.4-4.2L1.9 3.7A1 1 0 0 1 3.3 2.3ZM7.1 8.5 8.6 10A3.9 3.9 0 0 0 12 15.8c.4 0 .8 0 1.1-.1l1.5 1.5A9.7 9.7 0 0 1 12 17c-3.9 0-7.1-2.4-8.5-5 1-1.8 2.6-3.3 4.6-4.2Zm4.2 4.2 1.9 1.9a1.8 1.8 0 0 1-1.9-1.9ZM12 5c1.1 0 2.2.2 3.2.5l-1.5 1.5A8 8 0 0 0 12 7C8.1 7 4.9 9.4 3.5 12c.3.6.7 1.2 1.1 1.8L3.2 15A12 12 0 0 1 1.3 12.5a1.2 1.2 0 0 1 0-1C2.8 8.3 6.8 5 12 5Zm8.5 7c-.3.7-.8 1.4-1.3 2.1l-1.4-1.4c.4-.5.7-1 .9-1.4C19.1 9.4 15.9 7 12 7h-.3l-1.6-1.6c.6-.2 1.2-.3 1.9-.4 5.2 0 9.2 3.3 10.7 6.5a1.2 1.2 0 0 1 0 1c-.3.7-.7 1.4-1.2 2Z"/></svg>
            </button>
          </div>
          <button type="submit" class="auth-submit" id="loginSubmit">Log in</button>
        </form>
        <div class="auth-divider" role="separator"><span>OR</span></div>
        <a class="google-login-button" id="googleLoginButton" href="#">
          <svg class="google-login-icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Continue with Google
        </a>
        <p class="auth-switch">
          Don't have an account?
          <button type="button" class="auth-switch-button" id="showSignupButton">Sign up</button>
        </p>
      </div>

      <div id="signupPanel" hidden>
        <form id="signupForm" class="auth-form">
          <label for="signupName">Name</label>
          <input id="signupName" name="name" type="text" autocomplete="name" maxlength="80" required />
          <label for="signupEmail">Email</label>
          <input id="signupEmail" name="email" type="email" autocomplete="email" required />
          <label for="signupPassword">Password</label>
          <div class="password-field">
            <input id="signupPassword" name="password" type="password" autocomplete="new-password" minlength="8" required />
            <button type="button" class="password-toggle" data-target="signupPassword" aria-label="Show password" title="Show password">
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 5c5.2 0 9.2 3.3 10.7 6.5a1.2 1.2 0 0 1 0 1C21.2 15.7 17.2 19 12 19S2.8 15.7 1.3 12.5a1.2 1.2 0 0 1 0-1C2.8 8.3 6.8 5 12 5Zm0 2C8.1 7 4.9 9.4 3.5 12 4.9 14.6 8.1 17 12 17s7.1-2.4 8.5-5C19.1 9.4 15.9 7 12 7Zm0 2.2A2.8 2.8 0 1 1 12 14.8 2.8 2.8 0 0 1 12 9.2Z"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3.3 2.3 21.7 20.7a1 1 0 0 1-1.4 1.4l-3.2-3.2A11.6 11.6 0 0 1 12 19c-5.2 0-9.2-3.3-10.7-6.5a1.2 1.2 0 0 1 0-1c.7-1.5 1.9-3 3.4-4.2L1.9 3.7A1 1 0 0 1 3.3 2.3ZM7.1 8.5 8.6 10A3.9 3.9 0 0 0 12 15.8c.4 0 .8 0 1.1-.1l1.5 1.5A9.7 9.7 0 0 1 12 17c-3.9 0-7.1-2.4-8.5-5 1-1.8 2.6-3.3 4.6-4.2Zm4.2 4.2 1.9 1.9a1.8 1.8 0 0 1-1.9-1.9ZM12 5c1.1 0 2.2.2 3.2.5l-1.5 1.5A8 8 0 0 0 12 7C8.1 7 4.9 9.4 3.5 12c.3.6.7 1.2 1.1 1.8L3.2 15A12 12 0 0 1 1.3 12.5a1.2 1.2 0 0 1 0-1C2.8 8.3 6.8 5 12 5Zm8.5 7c-.3.7-.8 1.4-1.3 2.1l-1.4-1.4c.4-.5.7-1 .9-1.4C19.1 9.4 15.9 7 12 7h-.3l-1.6-1.6c.6-.2 1.2-.3 1.9-.4 5.2 0 9.2 3.3 10.7 6.5a1.2 1.2 0 0 1 0 1c-.3.7-.7 1.4-1.2 2Z"/></svg>
            </button>
          </div>
          <label for="signupConfirm">Confirm password</label>
          <div class="password-field">
            <input id="signupConfirm" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required />
            <button type="button" class="password-toggle" data-target="signupConfirm" aria-label="Show password" title="Show password">
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 5c5.2 0 9.2 3.3 10.7 6.5a1.2 1.2 0 0 1 0 1C21.2 15.7 17.2 19 12 19S2.8 15.7 1.3 12.5a1.2 1.2 0 0 1 0-1C2.8 8.3 6.8 5 12 5Zm0 2C8.1 7 4.9 9.4 3.5 12 4.9 14.6 8.1 17 12 17s7.1-2.4 8.5-5C19.1 9.4 15.9 7 12 7Zm0 2.2A2.8 2.8 0 1 1 12 14.8 2.8 2.8 0 0 1 12 9.2Z"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3.3 2.3 21.7 20.7a1 1 0 0 1-1.4 1.4l-3.2-3.2A11.6 11.6 0 0 1 12 19c-5.2 0-9.2-3.3-10.7-6.5a1.2 1.2 0 0 1 0-1c.7-1.5 1.9-3 3.4-4.2L1.9 3.7A1 1 0 0 1 3.3 2.3ZM7.1 8.5 8.6 10A3.9 3.9 0 0 0 12 15.8c.4 0 .8 0 1.1-.1l1.5 1.5A9.7 9.7 0 0 1 12 17c-3.9 0-7.1-2.4-8.5-5 1-1.8 2.6-3.3 4.6-4.2Zm4.2 4.2 1.9 1.9a1.8 1.8 0 0 1-1.9-1.9ZM12 5c1.1 0 2.2.2 3.2.5l-1.5 1.5A8 8 0 0 0 12 7C8.1 7 4.9 9.4 3.5 12c.3.6.7 1.2 1.1 1.8L3.2 15A12 12 0 0 1 1.3 12.5a1.2 1.2 0 0 1 0-1C2.8 8.3 6.8 5 12 5Zm8.5 7c-.3.7-.8 1.4-1.3 2.1l-1.4-1.4c.4-.5.7-1 .9-1.4C19.1 9.4 15.9 7 12 7h-.3l-1.6-1.6c.6-.2 1.2-.3 1.9-.4 5.2 0 9.2 3.3 10.7 6.5a1.2 1.2 0 0 1 0 1c-.3.7-.7 1.4-1.2 2Z"/></svg>
            </button>
          </div>
          <button type="submit" class="auth-submit" id="signupSubmit">Create account</button>
        </form>
        <p class="auth-switch">
          Already have an account?
          <button type="button" class="auth-switch-button" id="showLoginButton">Log in</button>
        </p>
      </div>
    </div>
  </div>

  <div class="app-shell" id="appShell" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Chat navigation">
      <div class="sidebar-rail">
        <div class="sidebar-brand" title="NovaChat AI" aria-hidden="true">✨</div>
        <button type="button" class="nav-icon-button" id="newChatButton" aria-label="New chat" title="New chat">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M12 5a1 1 0 0 1 1 1v5h5a1 1 0 1 1 0 2h-5v5a1 1 0 1 1-2 0v-5H6a1 1 0 1 1 0-2h5V6a1 1 0 0 1 1-1Z"/>
          </svg>
        </button>
        <button type="button" class="nav-icon-button" id="searchToggle" aria-label="Search history" title="Search" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M10.5 5a5.5 5.5 0 0 1 4.38 8.83l3.9 3.9a1 1 0 0 1-1.42 1.42l-3.9-3.9A5.5 5.5 0 1 1 10.5 5Zm0 2a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/>
          </svg>
        </button>
        <button type="button" class="nav-icon-button" id="historyToggle" aria-label="Chat history" title="History" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M12 4a8 8 0 1 1-5.3 14.02 1 1 0 0 1 1.32-1.5A6 6 0 1 0 8.4 7.2L9.8 8.6A1 1 0 0 1 8.4 10L5 6.6A1 1 0 0 1 5.7 5h4.3a1 1 0 0 1 0 2H8.12A8 8 0 0 1 12 4Zm1 4a1 1 0 0 1 1 1v2.38l1.76 1.76a1 1 0 1 1-1.42 1.42l-2.05-2.05A1 1 0 0 1 12 12V9a1 1 0 0 1 1-1Z"/>
          </svg>
        </button>
        <div class="sidebar-rail-spacer"></div>
        <button type="button" class="account-rail-button" id="accountButton" aria-label="Account menu" title="Account" aria-haspopup="menu" aria-expanded="false">
          <img id="accountRailPicture" class="account-rail-photo" alt="" referrerpolicy="no-referrer" hidden />
          <span id="accountInitial">?</span>
        </button>
      </div>
      <div class="sidebar-panel" id="sidebarPanel">
        <div class="sidebar-panel-header">
          <div>
            <p class="sidebar-panel-brand">✨ NovaChat</p>
            <h2 id="sidebarPanelTitle">History</h2>
          </div>
          <button type="button" class="nav-icon-button is-small" id="historyClose" aria-label="Collapse history" title="Collapse">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M15.5 5.5a1 1 0 0 1 0 1.4L10.4 12l5.1 5.1a1 1 0 1 1-1.4 1.4l-5.8-5.8a1 1 0 0 1 0-1.4l5.8-5.8a1 1 0 0 1 1.4 0Z"/>
            </svg>
          </button>
        </div>
        <button type="button" class="sidebar-new-chat" id="newChatPanelButton">＋ New Chat</button>
        <div class="history-search-wrap" id="historySearchWrap" hidden>
          <label class="visually-hidden" for="historySearchInput">Search conversations</label>
          <input id="historySearchInput" class="history-search-input" type="search" placeholder="Search conversations..." autocomplete="off" />
        </div>
        <p class="history-status" id="historyStatus" hidden></p>
        <div class="conversation-list" id="conversationList" role="list"></div>
        <div class="sidebar-footer">
          <button type="button" class="sidebar-user-button" id="accountFooterButton">
            <img id="sidebarUserPicture" class="sidebar-user-photo" alt="" referrerpolicy="no-referrer" hidden />
            <span class="sidebar-user-avatar" id="sidebarUserEmoji" aria-hidden="true">👤</span>
            <span class="sidebar-user-meta">
              <span class="sidebar-user-name" id="sidebarUserName">Account</span>
              <span class="sidebar-user-email" id="sidebarUserEmail"></span>
            </span>
          </button>
          <button type="button" class="sidebar-footer-link" id="settingsButton">⚙ Settings</button>
          <button type="button" class="sidebar-footer-link" id="logoutButton">↪ Logout</button>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>

    <div class="chat-app">
      <header class="chat-header">
        <h1>NovaChat AI</h1>
        <p>Your Intelligent AI Assistant</p>
      </header>

      <main class="chat-window" id="chatWindow">
        <section class="welcome-section" id="welcomeSection" aria-label="Welcome">
          <p class="welcome-sparkle" aria-hidden="true">✨</p>
          <p class="welcome-greeting" id="welcomeGreeting">Hi! How are you today?</p>
          <p class="welcome-subtitle">Ask me anything...</p>
          <div class="welcome-suggestions">
            <button type="button" class="suggestion-chip" data-suggestion="Explain Python">Explain Python</button>
            <button type="button" class="suggestion-chip" data-suggestion="Help me learn coding">Help me learn coding</button>
            <button type="button" class="suggestion-chip" data-suggestion="Write something">Write something</button>
            <button type="button" class="suggestion-chip" data-suggestion="Brainstorm an idea">Brainstorm an idea</button>
          </div>
        </section>
      </main>

      <form id="chatForm" class="chat-input-area">
        <textarea id="userInput" rows="1" placeholder="Type your message..." autocomplete="off"></textarea>
        <div class="voice-input-controls">
          <label class="voice-lang-wrap" for="voiceLangSelect">
            <span class="visually-hidden">Voice input language</span>
            <select id="voiceLangSelect" class="voice-lang-select" aria-label="Voice input language">
              <option value="en">English</option>
              <option value="hi">हिंदी</option>
            </select>
          </label>
          <button type="button" id="micButton" class="mic-button" aria-label="Voice input" title="Voice input" aria-pressed="false">
            <svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 14a3 3 0 0 0 3-3V7a3 3 0 1 0-6 0v4a3 3 0 0 0 3 3Z" fill="currentColor"/>
              <path d="M17.5 11a1 1 0 1 0-2 0 3.5 3.5 0 1 1-7 0 1 1 0 1 0-2 0 5.5 5.5 0 0 0 4.5 5.41V19H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.59A5.5 5.5 0 0 0 17.5 11Z" fill="currentColor"/>
            </svg>
            <span class="mic-listening-dot" aria-hidden="true"></span>
          </button>
        </div>
        <button type="submit" id="sendButton">Send</button>
        <button type="button" id="cancelEditButton" class="cancel-edit-button" hidden>Cancel</button>
        <p id="voiceStatus" class="voice-status" aria-live="polite" hidden></p>
      </form>
    </div>
  </div>

  <div id="accountMenu" class="account-menu" role="menu" hidden>
    <button type="button" class="account-menu-item" data-action="profile" role="menuitem">Profile</button>
    <button type="button" class="account-menu-item" data-action="settings" role="menuitem">Settings</button>
    <button type="button" class="account-menu-item" data-action="logout" role="menuitem">Logout</button>
  </div>
  <div id="accountDialog" class="account-dialog" hidden>
    <div class="account-dialog-card" role="dialog" aria-modal="true" aria-labelledby="accountDialogTitle">
      <h2 id="accountDialogTitle">Profile</h2>
      <p id="accountDialogBody"></p>
      <button type="button" class="auth-submit" id="accountDialogClose">Close</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
