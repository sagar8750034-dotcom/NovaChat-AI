# NovaChat AI — static frontend for Netlify
# Active UI files: index.html, styles.css, script.js, config.js
# Flask/Python backend stays on Render; do not put secrets here.

[build]
  publish = "."
  # Writes config.js from NOVACHAT_API_BASE_URL or API_BASE_URL (public Render origin only).
  command = "node -e \"const fs=require('fs'); const u=(process.env.NOVACHAT_API_BASE_URL||process.env.API_BASE_URL||process.env.BACKEND_URL||'https://novachat-ai.onrender.com').trim().replace(/\\/+$/,''); fs.writeFileSync('config.js', 'window.NOVACHAT_API_BASE_URL = ' + JSON.stringify(u) + ';\\nwindow.API_BASE_URL = window.NOVACHAT_API_BASE_URL;\\n');\""

# SPA-style fallback is NOT used — this is a single index.html app.
# Do not add /* → /index.html redirects that could mask missing assets.
